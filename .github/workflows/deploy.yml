# Lab 13: CI/CD — creates GCE VM (if missing), builds React app, deploys via Nginx
#
# GitHub secrets:
#   GCP_SA_KEY      — full JSON key for GCP service account
#   GCP_PROJECT_ID  — e.g. gen-lang-client-0073142903

name: Build and Deploy to GCE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  WEB_ROOT: /var/www/lab13
  GCE_INSTANCE: lab13-ci-vm
  GCE_ZONE: us-central1-a
  MACHINE_TYPE: e2-micro
  IMAGE_FAMILY: ubuntu-2204-lts
  IMAGE_PROJECT: ubuntu-os-cloud
  FIREWALL_RULE: allow-http-lab13

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f build/index.html

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Ensure HTTP firewall rule exists
        run: |
          set -euo pipefail
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          if ! gcloud compute firewall-rules describe "${{ env.FIREWALL_RULE }}" --quiet 2>/dev/null; then
            gcloud compute firewall-rules create "${{ env.FIREWALL_RULE }}" \
              --allow=tcp:80 \
              --target-tags=http-server \
              --description="Lab 13 HTTP"
          fi

      - name: Create Compute Engine VM if it does not exist
        id: provision
        run: |
          set -euo pipefail
          INSTANCE="${{ env.GCE_INSTANCE }}"
          ZONE="${{ env.GCE_ZONE }}"

          if gcloud compute instances describe "${INSTANCE}" --zone="${ZONE}" --quiet 2>/dev/null; then
            echo "VM ${INSTANCE} already exists — skipping create."
            echo "created=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Creating VM ${INSTANCE} in ${ZONE}..."
            gcloud compute instances create "${INSTANCE}" \
              --zone="${ZONE}" \
              --machine-type="${{ env.MACHINE_TYPE }}" \
              --image-family="${{ env.IMAGE_FAMILY }}" \
              --image-project="${{ env.IMAGE_PROJECT }}" \
              --boot-disk-size=20GB \
              --tags=http-server \
              --metadata-from-file=startup-script=scripts/vm-bootstrap.sh
            echo "created=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Wait for VM bootstrap (first create only)
        if: steps.provision.outputs.created == 'true'
        run: sleep 90

      - name: Wait for SSH and Nginx
        run: |
          set -euo pipefail
          INSTANCE="${{ env.GCE_INSTANCE }}"
          ZONE="${{ env.GCE_ZONE }}"
          for i in $(seq 1 12); do
            if gcloud compute ssh "${INSTANCE}" \
              --zone="${ZONE}" \
              --quiet \
              --ssh-flag="-o StrictHostKeyChecking=no" \
              --command="systemctl is-active nginx" 2>/dev/null; then
              echo "VM is ready."
              exit 0
            fi
            echo "Attempt ${i}/12 — retrying in 15s..."
            sleep 15
          done
          echo "VM not ready after retries."
          exit 1

      - name: Deploy build to Compute Engine
        run: |
          set -euo pipefail
          INSTANCE="${{ env.GCE_INSTANCE }}"
          ZONE="${{ env.GCE_ZONE }}"

          gcloud compute ssh "${INSTANCE}" \
            --zone="${ZONE}" \
            --quiet \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --command="mkdir -p ~/deploy-staging"

          gcloud compute scp --recurse \
            build/* \
            "${INSTANCE}:~/deploy-staging/" \
            --zone="${ZONE}" \
            --quiet \
            --scp-flag="-o StrictHostKeyChecking=no"

          gcloud compute ssh "${INSTANCE}" \
            --zone="${ZONE}" \
            --quiet \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --command="sudo rsync -a --delete ~/deploy-staging/ ${WEB_ROOT}/ && sudo chown -R www-data:www-data ${WEB_ROOT} && sudo systemctl reload nginx && rm -rf ~/deploy-staging"

      - name: Print deployment URL
        run: |
          IP=$(gcloud compute instances describe "${{ env.GCE_INSTANCE }}" \
            --zone="${{ env.GCE_ZONE }}" \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "Deployed to http://${IP}"
